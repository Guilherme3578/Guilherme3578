<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1f3f"/>
      <stop offset="0.45" stop-color="#6b4a78"/>
      <stop offset="0.8" stop-color="#e59a8c"/>
      <stop offset="1" stop-color="#f7cfae"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3a63"/>
      <stop offset="1" stop-color="#15162b"/>
    </linearGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4f7c"/>
      <stop offset="1" stop-color="#3a3459"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .petal { animation: fall 9s linear infinite; }
      @keyframes fall {
        0% { transform: translate(0,0) rotate(0deg); opacity: 0 }
        10% { opacity: 1 }
        100% { transform: translate(260px,300px) rotate(540deg); opacity: 0 }
      }
      .ripple { animation: ripple 4s ease-in-out infinite; }
      @keyframes ripple { 50% { transform: translateX(14px); opacity: .35 } }
      .lantern { animation: sway 3s ease-in-out infinite; transform-origin: top center; transform-box: fill-box; }
      @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
      .halo { animation: halo 2.5s ease-in-out infinite; }
      @keyframes halo { 50% { opacity: .45 } }
      .bird { animation: fly 26s linear infinite; }
      @keyframes fly { from { transform: translate(-80px,0) } to { transform: translate(1300px,-50px) } }
      .cloud { animation: drift 70s linear infinite; }
      @keyframes drift { from { transform: translateX(-260px) } to { transform: translateX(1300px) } }
    </style>
  </defs>

  <!-- céu e lua -->
  <rect width="1200" height="340" fill="url(#sky)"/>
  <circle cx="880" cy="95" r="52" fill="#fbe9d0" opacity=".92"/>
  <g fill="#fff" opacity=".7">
    <circle cx="120" cy="40" r="1.2"/><circle cx="300" cy="25" r="1"/><circle cx="460" cy="55" r="1.3"/>
    <circle cx="700" cy="30" r="1"/><circle cx="1040" cy="45" r="1.2"/><circle cx="1150" cy="20" r="1"/>
  </g>

  <!-- nuvens finas -->
  <g fill="#f7d9c4" opacity=".45">
    <g class="cloud"><rect x="0" y="120" width="180" height="5" rx="2.5"/><rect x="40" y="128" width="120" height="4" rx="2"/></g>
    <g class="cloud" style="animation-delay:-35s"><rect x="0" y="70" width="140" height="4" rx="2"/><rect x="30" y="77" width="90" height="4" rx="2"/></g>
  </g>

  <!-- monte Fuji -->
  <path d="M330 230 L540 92 Q560 80 580 92 L790 230 Z" fill="url(#fuji)"/>
  <path d="M500 118 L540 92 Q560 80 580 92 L620 118 L602 112 L588 124 L572 110 L556 126 L540 112 L520 124 Z" fill="#f4eef5"/>
  <!-- colinas -->
  <path d="M0 230 Q120 180 260 214 T520 222 T800 210 T1200 220 V230 H0Z" fill="#2e2a4d"/>

  <!-- água -->
  <rect x="0" y="230" width="1200" height="110" fill="url(#water)"/>
  <!-- reflexo da lua -->
  <g fill="#fbe9d0">
    <rect class="ripple" x="850" y="244" width="60" height="2" opacity=".6"/>
    <rect class="ripple" style="animation-delay:.6s" x="860" y="256" width="40" height="2" opacity=".5"/>
    <rect class="ripple" style="animation-delay:1.2s" x="866" y="268" width="28" height="2" opacity=".4"/>
    <rect class="ripple" style="animation-delay:1.8s" x="872" y="280" width="16" height="2" opacity=".3"/>
  </g>
  <g fill="#8c86b8" opacity=".35">
    <rect class="ripple" x="80" y="300" width="90" height="2"/>
    <rect class="ripple" style="animation-delay:2s" x="520" y="290" width="120" height="2"/>
    <rect class="ripple" style="animation-delay:1s" x="1040" y="310" width="80" height="2"/>
  </g>

  <!-- torii sobre a água -->
  <g transform="translate(560,0)">
    <g fill="#c8372d">
      <path d="M-78 164 Q0 150 78 164 L82 156 Q0 140 -82 156 Z"/>
      <rect x="-70" y="166" width="140" height="10"/>
      <rect x="-4" y="166" width="8" height="22"/>
      <rect x="-66" y="188" width="132" height="9"/>
      <rect x="-56" y="166" width="12" height="80"/>
      <rect x="44" y="166" width="12" height="80"/>
    </g>
    <path d="M-82 156 Q0 140 82 156 L80 152 Q0 136 -80 152 Z" fill="#1f1a2e"/>
    <rect x="-58" y="240" width="16" height="6" fill="#1f1a2e"/>
    <rect x="42" y="240" width="16" height="6" fill="#1f1a2e"/>
    <!-- reflexo -->
    <g fill="#c8372d" opacity=".25">
      <rect x="-56" y="246" width="12" height="60"/>
      <rect x="44" y="246" width="12" height="60"/>
      <rect x="-66" y="295" width="132" height="6"/>
    </g>
  </g>

  <!-- pagode -->
  <g transform="translate(1040,0)" fill="#241f3a">
    <rect x="-6" y="70" width="4" height="26"/>
    <path d="M-30 110 Q-4 96 22 110 L26 104 L-34 104Z"/><rect x="-22" y="110" width="40" height="18"/>
    <path d="M-42 138 Q-4 122 34 138 L40 130 L-48 130Z"/><rect x="-30" y="138" width="56" height="20"/>
    <path d="M-54 168 Q-4 150 46 168 L54 160 L-62 160Z"/><rect x="-38" y="168" width="72" height="22"/>
    <path d="M-66 200 Q-4 180 58 200 L68 190 L-76 190Z"/><rect x="-46" y="200" width="88" height="30"/>
    <rect x="-12" y="208" width="16" height="22" fill="#ffcf7a" opacity=".8" class="halo"/>
    <rect x="-38" y="174" width="8" height="10" fill="#ffcf7a" opacity=".7" class="halo"/>
    <rect x="22" y="144" width="7" height="8" fill="#ffcf7a" opacity=".7" class="halo"/>
  </g>

  <!-- lanternas -->
  <g>
    <line x1="700" y1="0" x2="700" y2="40" stroke="#241f3a" stroke-width="1.5"/>
    <g class="lantern">
      <rect x="699" y="40" width="2" height="4" fill="#241f3a"/>
      <circle cx="700" cy="60" r="22" fill="url(#glow)" class="halo"/>
      <rect x="688" y="44" width="24" height="32" rx="10" fill="#d9453a"/>
      <rect x="690" y="44" width="20" height="3" fill="#241f3a"/><rect x="690" y="73" width="20" height="3" fill="#241f3a"/>
    </g>
    <line x1="1160" y1="0" x2="1160" y2="60" stroke="#241f3a" stroke-width="1.5"/>
    <g class="lantern" style="animation-delay:1s">
      <circle cx="1160" cy="80" r="22" fill="url(#glow)" class="halo"/>
      <rect x="1148" y="64" width="24" height="32" rx="10" fill="#d9453a"/>
      <rect x="1150" y="64" width="20" height="3" fill="#241f3a"/><rect x="1150" y="93" width="20" height="3" fill="#241f3a"/>
    </g>
  </g>

  <!-- pássaros -->
  <g class="bird" fill="none" stroke="#241f3a" stroke-width="2" stroke-linecap="round">
    <path d="M0 80 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M30 96 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <!-- cerejeira -->
  <g>
    <path d="M0 340 L0 230 Q40 200 60 150 Q80 110 140 90 L146 98 Q96 120 84 160 Q120 140 200 140 L200 148 Q130 152 90 180 Q70 220 70 340 Z" fill="#2a1f2e"/>
    <path d="M60 150 Q40 110 10 90 L16 84 Q50 104 68 140 Z" fill="#2a1f2e"/>
    <g fill="#f4a6c0">
      <circle cx="20" cy="80" r="40"/><circle cx="80" cy="70" r="44"/><circle cx="140" cy="84" r="38"/>
      <circle cx="190" cy="130" r="34"/><circle cx="120" cy="130" r="30"/><circle cx="40" cy="130" r="30"/>
    </g>
    <g fill="#f9c6d6">
      <circle cx="70" cy="56" r="26"/><circle cx="140" cy="70" r="22"/><circle cx="196" cy="120" r="18"/><circle cx="16" cy="66" r="20"/>
    </g>
    <g fill="#e07fa3" opacity=".7">
      <circle cx="104" cy="104" r="14"/><circle cx="170" cy="150" r="12"/><circle cx="36" cy="110" r="12"/>
    </g>
  </g>

  <!-- pétalas caindo -->
  <g fill="#f9c6d6">
    <ellipse class="petal" cx="60" cy="90" rx="4" ry="2.5"/>
    <ellipse class="petal" style="animation-delay:1.5s" cx="140" cy="110" rx="4" ry="2.5"/>
    <ellipse class="petal" style="animation-delay:3s" cx="200" cy="140" rx="3.5" ry="2"/>
    <ellipse class="petal" style="animation-delay:4.5s" cx="100" cy="70" rx="4" ry="2.5"/>
    <ellipse class="petal" style="animation-delay:6s" cx="30" cy="120" rx="3.5" ry="2"/>
    <ellipse class="petal" style="animation-delay:7.5s" cx="170" cy="90" rx="4" ry="2.5"/>
    <ellipse class="petal" style="animation-delay:2.2s" cx="240" cy="60" rx="3" ry="2"/>
    <ellipse class="petal" style="animation-delay:5.2s" cx="320" cy="40" rx="3" ry="2"/>
  </g>

  <text x="1180" y="326" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#d8d2ec" opacity=".75" letter-spacing="2">obrigado pela visita</text>
</svg>
