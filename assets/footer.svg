<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1033"/>
      <stop offset="0.55" stop-color="#7a2e5c"/>
      <stop offset="1" stop-color="#f08a4b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <clipPath id="sunClip"><rect x="0" y="0" width="1200" height="200"/></clipPath>
    <style>
      .cloud { animation: drift 40s linear infinite; }
      .cloud2 { animation: drift 60s linear infinite -20s; }
      @keyframes drift { from { transform: translateX(-300px) } to { transform: translateX(1300px) } }
      .grid { animation: run 1.6s linear infinite; }
      @keyframes run { from { transform: translateY(0) } to { transform: translateY(20px) } }
      .bird { animation: fly 18s linear infinite; }
      @keyframes fly { from { transform: translate(-60px,0) } to { transform: translate(1260px,-40px) } }
      .flap { animation: flap .4s steps(1) infinite; }
      @keyframes flap { 50% { transform: scaleY(-1) } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <!-- sol com faixas -->
  <g clip-path="url(#sunClip)">
    <circle cx="600" cy="190" r="110" fill="url(#sun)"/>
    <g fill="#7a2e5c">
      <rect x="480" y="150" width="240" height="5"/>
      <rect x="480" y="166" width="240" height="7"/>
      <rect x="480" y="182" width="240" height="9"/>
    </g>
  </g>

  <!-- nuvens -->
  <g fill="#ffd2c2" opacity="0.55">
    <g class="cloud"><rect x="0" y="50" width="120" height="12"/><rect x="24" y="38" width="64" height="12"/></g>
    <g class="cloud2"><rect x="0" y="95" width="160" height="12"/><rect x="40" y="83" width="80" height="12"/></g>
  </g>

  <!-- pássaro -->
  <g class="bird"><g transform="translate(0,90)" fill="#1b1033">
    <rect x="0" y="0" width="6" height="3"/><rect x="6" y="3" width="4" height="3"/><rect x="10" y="0" width="6" height="3"/>
  </g></g>

  <!-- montanhas em pixel -->
  <g fill="#3b1d4a">
    <polygon points="0,200 80,150 150,180 240,120 330,175 420,140 520,200"/>
    <polygon points="680,200 760,135 850,170 940,110 1040,165 1120,130 1200,170 1200,200"/>
  </g>
  <g fill="#24123a">
    <polygon points="0,200 60,175 130,195 210,160 300,200"/>
    <polygon points="880,200 960,165 1050,190 1130,158 1200,185 1200,200"/>
  </g>

  <!-- chão synthwave -->
  <rect x="0" y="200" width="1200" height="120" fill="#140a26"/>
  <g stroke="#ff4fa3" stroke-width="2" opacity="0.7">
    <line x1="600" y1="200" x2="600" y2="320"/>
    <line x1="560" y1="200" x2="360" y2="320"/><line x1="640" y1="200" x2="840" y2="320"/>
    <line x1="520" y1="200" x2="120" y2="320"/><line x1="680" y1="200" x2="1080" y2="320"/>
    <line x1="480" y1="200" x2="-120" y2="320"/><line x1="720" y1="200" x2="1320" y2="320"/>
    <line x1="440" y1="200" x2="-360" y2="320"/><line x1="760" y1="200" x2="1560" y2="320"/>
  </g>
  <svg x="0" y="200" width="1200" height="120" overflow="hidden">
    <g class="grid" stroke="#ff4fa3" stroke-width="2" opacity="0.7">
      <line x1="0" y1="-20" x2="1200" y2="-20"/>
      <line x1="0" y1="0" x2="1200" y2="0"/>
      <line x1="0" y1="20" x2="1200" y2="20"/>
      <line x1="0" y1="40" x2="1200" y2="40"/>
      <line x1="0" y1="60" x2="1200" y2="60"/>
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="100" x2="1200" y2="100"/>
    </g>
  </svg>
  <rect x="0" y="198" width="1200" height="3" fill="#ffb3d9"/>

  <text x="600" y="300" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#ffd2c2" opacity="0.8" letter-spacing="3">obrigado pela visita :)</text>
</svg>
