<svg xmlns="http://www.w3.org/2000/svg" width="420" height="320" viewBox="0 0 420 320">
  <defs>
    <style>
      .type { animation: type 2.4s steps(6) infinite; }
      @keyframes type { from { width: 0 } to { width: 96px } }
      .type2 { animation: type2 2.4s steps(5) infinite .8s; }
      @keyframes type2 { from { width: 0 } to { width: 70px } }
      .hand { animation: tap .25s ease-in-out infinite alternate; }
      .hand2 { animation: tap .25s ease-in-out infinite alternate-reverse; }
      @keyframes tap { from { transform: translateY(0) } to { transform: translateY(-3px) } }
      .bob { animation: bob 1.2s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(2px) } }
      .steam { animation: steam 2s ease-out infinite; }
      @keyframes steam { 0% { opacity: 0; transform: translateY(4px) } 40% { opacity: .7 } 100% { opacity: 0; transform: translateY(-14px) } }
      .float { animation: float 3s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px) } }
      .blink { animation: bl 1s steps(1) infinite; }
      @keyframes bl { 50% { opacity: 0 } }
    </style>
  </defs>

  <!-- decoração -->
  <g fill="none" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="4 6" opacity=".6">
    <circle cx="210" cy="150" r="140"/>
  </g>
  <g class="float">
    <rect x="320" y="30" width="70" height="46" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
    <text x="355" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6c63ff">&lt;/&gt;</text>
  </g>
  <g class="float" style="animation-delay:1.2s">
    <rect x="26" y="50" width="64" height="40" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
    <text x="58" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#ED8B00">{ }</text>
  </g>

  <!-- monitor -->
  <rect x="200" y="96" width="170" height="112" rx="8" fill="#2d3142"/>
  <rect x="208" y="104" width="154" height="92" rx="4" fill="#11141c"/>
  <g font-family="Consolas, monospace" font-size="9">
    <rect x="216" y="112" width="30" height="5" rx="2" fill="#f2c14e"/>
    <rect x="250" y="112" width="40" height="5" rx="2" fill="#6c63ff"/>
    <svg x="226" y="124" width="100" height="6"><rect class="type" width="96" height="5" rx="2" fill="#61DAFB"/></svg>
    <svg x="226" y="136" width="80" height="6"><rect class="type2" width="70" height="5" rx="2" fill="#6DB33F"/></svg>
    <rect x="226" y="148" width="50" height="5" rx="2" fill="#8a93a8"/>
    <rect x="216" y="160" width="20" height="5" rx="2" fill="#f2c14e"/>
    <rect x="216" y="174" width="6" height="9" fill="#f2c14e" class="blink"/>
  </g>
  <rect x="276" y="208" width="18" height="18" fill="#2d3142"/>
  <rect x="256" y="224" width="58" height="6" rx="3" fill="#2d3142"/>

  <!-- mesa -->
  <rect x="40" y="230" width="350" height="10" rx="4" fill="#c9b79c"/>
  <rect x="60" y="240" width="10" height="70" fill="#a8977d"/>
  <rect x="360" y="240" width="10" height="70" fill="#a8977d"/>

  <!-- café -->
  <g>
    <rect x="340" y="206" width="22" height="24" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="2"/>
    <path d="M362 212 q10 0 10 7 t-10 7" fill="none" stroke="#2d3142" stroke-width="2"/>
    <path class="steam" d="M346 200 q-4 -6 0 -12" fill="none" stroke="#8a93a8" stroke-width="2"/>
    <path class="steam" style="animation-delay:.7s" d="M354 200 q4 -6 0 -12" fill="none" stroke="#8a93a8" stroke-width="2"/>
  </g>

  <!-- pessoa (de costas, olhando o monitor) -->
  <g class="bob">
    <!-- cadeira -->
    <rect x="96" y="170" width="16" height="90" rx="6" fill="#4a4e69"/>
    <!-- corpo -->
    <path d="M110 230 q0 -70 50 -70 q40 0 40 40 v30 z" fill="#6c63ff"/>
    <!-- cabeça -->
    <circle cx="160" cy="130" r="30" fill="#f1c27d"/>
    <path d="M131 124 q4 -30 32 -30 q26 0 28 26 q-14 -12 -32 -10 q-18 2 -28 14z" fill="#3b2a1a"/>
    <!-- fone -->
    <path d="M132 128 q0 -40 30 -40 q30 0 30 40" fill="none" stroke="#2bd67b" stroke-width="6" stroke-linecap="round"/>
    <rect x="125" y="122" width="12" height="20" rx="5" fill="#2bd67b"/>
  </g>
  <!-- braços -->
  <g class="hand"><rect x="170" y="200" width="56" height="12" rx="6" fill="#5a52e0"/><circle cx="228" cy="206" r="7" fill="#f1c27d"/></g>
  <!-- teclado -->
  <rect x="214" y="222" width="80" height="8" rx="2" fill="#4a4e69"/>
  <g class="hand2"><rect x="186" y="210" width="50" height="11" rx="5" fill="#6c63ff"/><circle cx="240" cy="215" r="6" fill="#f1c27d"/></g>
</svg>
